var CATS=["全部","荤菜","素菜","汤羹","主食","凉菜"];
var CUISINES=["全部","川菜","粤菜","鲁菜","苏菜","浙菜","闽菜","湘菜","徽菜","本帮","东北","京菜","西北","家常"];
var curCuisine="全部";
var curCat="全部",bag=[];
function pool(){return DISHES.filter(function(d){return (curCat==="全部"||d.c===curCat)&&(curCuisine==="全部"||d.cuisine===curCuisine);});}
function refill(){bag=pool().map(function(d,i){return d;});for(var i=bag.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=bag[i];bag[i]=bag[j];bag[j]=t;}}
function showDish(d){
document.getElementById('dishName').textContent=d.n;
var di=document.getElementById('dishImg');var dvs=VIDEOS[d.n]||[];if(dvs.length){di.src=dvs[0].p;di.style.display='block';}else{di.style.display='none';}
document.getElementById('dishMeta').textContent=d.cuisine+" · "+d.c+" · 约"+d.t+"分钟";
document.getElementById('dishIng').innerHTML=d.ing.map(function(x){return '<span>'+x+'</span>';}).join('');
document.getElementById('dishSteps').innerHTML=d.st.map(function(x){return '<li>'+x+'</li>';}).join('');
curDish=d;
}
function pickRandom(){if(bag.length===0)refill();showDish(bag.pop());window.scrollTo({top:0,behavior:'smooth'});}
function renderPills(){document.getElementById('pills').innerHTML=CATS.map(function(c){return '<button type="button" class="'+(c===curCat?'on':'')+'" data-c="'+c+'">'+c+'</button>';}).join('');
document.querySelectorAll('#pills button').forEach(function(b){b.onclick=function(){curCat=b.getAttribute('data-c');bag=[];renderPills();renderList();pickRandom();};});}
function renderCuisinePills(){document.getElementById('cuisinePills').innerHTML=CUISINES.map(function(c){return '<button type="button" class="'+(c===curCuisine?'on':'')+'" data-c="'+c+'">'+c+'</button>';}).join('');
document.querySelectorAll('#cuisinePills button').forEach(function(b){b.onclick=function(){curCuisine=b.getAttribute('data-c');bag=[];renderCuisinePills();renderList();pickRandom();};});}
function renderList(){var list=pool();document.getElementById('list').innerHTML=list.map(function(d){var vs=VIDEOS[d.n]||[];var im=vs.length?'<img src="'+esc(vs[0].p)+'" alt="" loading="lazy">':'';return '<button type="button" class="dish" data-n="'+d.n+'">'+im+'<span class="dt"><b>'+d.n+'</b><div>'+d.cuisine+' · '+d.c+' · 约'+d.t+'分钟</div></span></button>';}).join('');
document.querySelectorAll('#list .dish').forEach(function(b){b.onclick=function(){var d=DISHES.filter(function(x){return x.n===b.getAttribute('data-n');})[0];showDish(d);window.scrollTo({top:0,behavior:'smooth'});};});}
var curDish=null;
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function cleanTitle(t){return esc(t.replace(/<[^>]*>/g,''));}
function searchUrl(name){return 'https://search.bilibili.com/all?keyword='+encodeURIComponent(name+'做法');}
function douyinUrl(name){return 'https://www.douyin.com/search/'+encodeURIComponent(name+'做法');}
function openVideo(){
if(!curDish)return;
var m=document.getElementById('vmodal');
document.getElementById('vtitle').textContent=curDish.n+' · 视频教程';
var videos=VIDEOS[curDish.n]||[];
if(videos.length===0){
document.getElementById('vbody').innerHTML='<div class="vnote">这道菜暂时没配视频，直接去 B 站看：</div><div class="btns"><a class="btn btn-video" href="'+searchUrl(curDish.n)+'" target="_blank" rel="noopener">去 B 站看'+esc(curDish.n)+'做法</a><a class="btn btn-video" href="'+douyinUrl(curDish.n)+'" target="_blank" rel="noopener">去抖音看'+esc(curDish.n)+'做法</a></div>';
}else{
var html=videos.map(function(v){
return '<button type="button" class="vitem" data-bvid="'+esc(v.b)+'"><img src="'+esc(v.p)+'" alt=""><span><span class="vt">'+esc(v.t)+'</span><span class="vm" style="display:block">'+esc(v.a)+' · '+esc(v.d)+'</span></span></button>';
}).join('');
html+='<div class="btns"><a class="btn btn-video" href="'+searchUrl(curDish.n)+'" target="_blank" rel="noopener">更多视频，去 B 站看</a><a class="btn btn-video" href="'+douyinUrl(curDish.n)+'" target="_blank" rel="noopener">去抖音看'+esc(curDish.n)+'做法</a></div>';
document.getElementById('vbody').innerHTML=html;
document.querySelectorAll('#vbody .vitem').forEach(function(b){b.onclick=function(){showPlayer(b.getAttribute('data-bvid'));};});
}
m.classList.add('open');
}
function showPlayer(bvid){
document.getElementById('vbody').innerHTML='<div class="vplayer"><iframe src="https://player.bilibili.com/player.html?bvid='+esc(bvid)+'&page=1&high_quality=1" allowfullscreen allow="autoplay; fullscreen"></iframe></div><div class="vnote">点一下画面开始播放；如果一直黑屏，点下面去 B 站看原片。</div><div class="btns"><a class="btn btn-video" href="https://www.bilibili.com/video/'+esc(bvid)+'" target="_blank" rel="noopener">去 B 站看这个视频</a><a class="btn btn-video" href="'+douyinUrl(curDish.n)+'" target="_blank" rel="noopener">去抖音看做法</a><button class="vback" type="button" id="vbackBtn">← 返回选片</button></div>';
document.getElementById('vbackBtn').onclick=function(){openVideo();};
}
function closeVideo(){document.getElementById('vmodal').classList.remove('open');document.getElementById('vbody').innerHTML='';}
document.getElementById('videoBtn').onclick=openVideo;
document.getElementById('vclose').onclick=closeVideo;
document.getElementById('vmodal').addEventListener('click',function(e){if(e.target.id==='vmodal')closeVideo();});
document.getElementById('randBtn').onclick=pickRandom;
renderPills();renderCuisinePills();renderList();pickRandom();
</script>
