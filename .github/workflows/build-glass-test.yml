name: Build glass test app (release APK, fixed signature)

on:
  push:
    branches: [main]
    paths:
      - "glass-test/**"
      - ".github/workflows/build-glass-test.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;37.0.0" || true
      - name: Build release APK (V1 + V2 + V3, fixed keystore from secrets)
        working-directory: glass-test
        env:
          KEYSTORE_BASE64: ${{ secrets.GLASS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.GLASS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GLASS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GLASS_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/glass-test-release.keystore
          chmod +x gradlew
          set -o pipefail
          KEYSTORE_PATH=/tmp/glass-test-release.keystore ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glass-test-build-log
          path: glass-test/build.log
      - name: Publish build error for diagnosis
        if: always()
        run: |
          grep -E "error:|e: |FAILED|What went wrong" glass-test/build.log | head -100 > glass-test/build-error.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f glass-test/build-error.txt
          git diff --cached --quiet || git commit -m "chore: publish glass test build error [skip ci]"
          git push || true
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: landezhaole-glass-test-release
          path: glass-test/app/build/outputs/apk/release/app-release.apk
      - name: Publish APK to repo for raw download
        run: |
          cp glass-test/app/build/outputs/apk/release/app-release.apk glass-test/app-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f glass-test/app-debug.apk
          git diff --cached --quiet || git commit -m "chore: publish glass test release APK [skip ci]"
          git push
