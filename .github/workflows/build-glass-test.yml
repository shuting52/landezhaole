name: Build glass test app (debug APK)

on:
  push:
    branches: [main]
    paths:
      - "glass-test/**"
      - ".github/workflows/build-glass-test.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;37.0.0" || true
      - name: Build debug APK
        working-directory: glass-test
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glass-test-build-log
          path: glass-test/build.log
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: landezhaole-glass-test-debug
          path: glass-test/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to repo for raw download
        run: |
          cp glass-test/app/build/outputs/apk/debug/app-debug.apk glass-test/app-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f glass-test/app-debug.apk
          git diff --cached --quiet || git commit -m "chore: publish glass test debug APK [skip ci]"
          git push
