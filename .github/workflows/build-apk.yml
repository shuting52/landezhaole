name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - name: Build release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.LANDEZHAOLE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LANDEZHAOLE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LANDEZHAOLE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LANDEZHAOLE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/landezhaole-release.keystore
          cd android && KEYSTORE_PATH=/tmp/landezhaole-release.keystore ./gradlew :app:assembleRelease --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: landezhaole-release-apk
          path: android/app/build/outputs/apk/release/*.apk
