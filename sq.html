<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--green:#16a34a;--green-d:#15803d;--red:#dc2626}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
a{color:inherit;text-decoration:none}
.topbar{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--line)}
.topbar .wrap{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.back{font-size:14px;color:var(--green);font-weight:700;white-space:nowrap}
.topbar h1{font-size:20px;margin:0}
.topbar .sub{font-size:13px;color:var(--muted);margin-left:4px}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:10px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 18px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--text)}
.tab img{width:20px;height:20px}
.tab.on{background:var(--green);border-color:var(--green);color:#fff}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.filters button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer;color:var(--text)}
.filters button.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.sq-card{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;align-items:flex-start}
.sq-card:hover{border-color:var(--green)}
.sq-left{flex:1;min-width:0}
.sq-logo{width:44px;height:44px;border-radius:11px;object-fit:contain}
.sq-title{font-size:16px;font-weight:800;margin:8px 0 4px}
.sq-desc{font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 8px}
.sq-tags{display:flex;gap:6px;flex-wrap:wrap}
.sq-tags span{font-size:11px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--muted)}
.sq-qr{flex-shrink:0;text-align:center}
.sq-qr img{width:110px;height:110px;border-radius:10px;display:block}
.sq-qr p{font-size:11px;color:var(--muted);margin:6px 0 0;line-height:1.5}
.sq-qr .go{display:inline-block;margin-top:8px;background:var(--green);color:#fff;font-size:12px;font-weight:700;padding:5px 14px;border-radius:999px}
.foot{text-align:center;color:var(--muted);font-size:12px;line-height:1.8;padding:28px 16px}
.foot a{color:var(--green)}
</style>
</head>

function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var curTab=0,curFilter='all';
function renderTabs(){
 document.getElementById('tabs').innerHTML=DATA.tabs.map(function(t,i){
  return '<button class="tab'+(i===curTab?' on':'')+'" data-i="'+i+'"><img src="'+esc(t.icon)+'" alt="">'+esc(t.name)+'</button>';
 }).join('');
 document.querySelectorAll('#tabs .tab').forEach(function(b){
  b.onclick=function(){curTab=parseInt(b.dataset.i,10);curFilter='all';renderFilters();renderGrid();renderTabs();};
 });
}
function renderFilters(){
 var fs=DATA.tabs[curTab].filters;
 document.getElementById('filters').innerHTML=fs.map(function(f){
  return '<button class="'+(f[0]===curFilter?'on':'')+'" data-f="'+f[0]+'">'+esc(f[1])+'</button>';
 }).join('');
 document.querySelectorAll('#filters button').forEach(function(b){
  b.onclick=function(){curFilter=b.dataset.f;renderFilters();renderGrid();};
 });
}
function renderGrid(){
 var list=DATA.cards.filter(function(c){
  if(c.tab!==curTab)return false;
  if(curFilter==='all')return true;
  return c.tagClasses.indexOf(curFilter)>=0;
 });
 document.getElementById('grid').innerHTML=list.map(function(c){
  return '<a class="sq-card" href="'+esc(c.href)+'" target="_blank" rel="noopener">'
   +'<div class="sq-left"><img class="sq-logo" src="'+esc(c.logo)+'" alt="'+esc(c.logoAlt)+'">'
   +'<div class="sq-title">'+esc(c.title)+'</div>'
   +'<p class="sq-desc">'+esc(c.desc)+'</p>'
   +'<div class="sq-tags">'+c.tags.map(function(t){return '<span>'+esc(t)+'</span>';}).join('')+'</div></div>'
   +'<div class="sq-qr"><img src="'+esc(c.qr)+'" alt="二维码"><p>打开手机<br>扫一扫领取</p><span class="go">领取优惠券</span></div></a>';
 }).join('');
}
renderTabs();renderFilters();renderGrid();
