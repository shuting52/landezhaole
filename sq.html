<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--green:#16a34a;--green-d:#15803d;--red:#dc2626}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
a{color:inherit;text-decoration:none}
.topbar{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--line)}
.topbar .wrap{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.back{font-size:14px;color:var(--green);font-weight:700;white-space:nowrap}
.topbar h1{font-size:20px;margin:0}
.topbar .sub{font-size:13px;color:var(--muted);margin-left:4px}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.tabbox{display:flex;justify-content:center;margin-top:4px}
.tab-item{text-align:center;display:flex;align-items:center;cursor:pointer;padding:10px 15px;position:relative;color:var(--text)}
.tab-item img{width:18px;height:18px;margin-right:5px}
.tab-item span{font-weight:700;font-size:16px}
.tab-item.on{background:#fff;border-radius:10px 10px 0 0;color:#283593;box-shadow:0 1px 4px rgba(0,0,0,.025),0 4px 32px rgba(0,0,0,.05)}
.tab-item.on::after,.tab-item.on::before{background-color:transparent;bottom:0;box-shadow:0 0 0 0 transparent;content:"";height:1rem;position:absolute;width:2rem}
.tab-item.on::after{border-bottom-left-radius:10px;box-shadow:-1rem 0 0 0 #fff;right:-2rem}
.tab-item.on::before{border-bottom-right-radius:10px;box-shadow:1rem 0 0 0 #fff;left:-2rem}
.tab-item .tab-line{position:absolute;left:0;width:100%;bottom:-15px;height:15px;background:#fff;display:none}
.tab-item.on .tab-line{display:block}
.filters{background:#fff;padding:0 20px;border-radius:12px;box-shadow:0 .25rem .5rem rgba(0,0,0,.05),0 1.5rem 2.2rem rgba(0,0,0,.1);white-space:nowrap;overflow:auto}
.filters span{position:relative;z-index:1;cursor:pointer;display:inline-block;padding:13px 0;margin-right:10px;font-size:14px}
.filters span:last-child{margin-right:0}
.filters span.on{font-weight:700;color:#283593}
.filters span.on::after{position:absolute;width:110%;border-radius:3px;bottom:12px;left:0;height:13px;transform:skewX(-15deg);background:linear-gradient(to right,transparent 0%,#f6dc3e 100%);content:'';z-index:-1}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:1024px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.sq-card{position:relative;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 12px 18px rgba(0,0,0,.06);z-index:1;aspect-ratio:1/1}
.sq-body{flex:1;padding:25px 25px 20px;position:relative;display:flex;flex-direction:column}
.sq-logo{position:absolute;top:20px;right:20px;width:48px;height:48px;border-radius:50px;padding:10px;background:linear-gradient(to left top,#f6f6ef 0%,#fff 100%);transition:opacity .25s}
.sq-logo img{width:100%;height:100%;object-fit:contain}
.sq-title{font-size:18px;font-weight:800;margin:0 0 5px;padding-right:60px;line-height:1.2;transition:opacity .25s}
.sq-desc{font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 8px;transition:opacity .25s}
.sq-tags{display:flex;gap:6px;flex-wrap:wrap;transition:opacity .25s}
.sq-tags span{font-size:11px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--muted)}
.sq-meta{margin:auto -25px 0;padding:10px 15px;border-top:2px dashed #f1f2f3;display:flex;justify-content:center;position:relative;color:#283593;font-size:14px}
.sq-meta::before,.sq-meta::after{content:'';position:absolute;top:-8px;width:16px;height:16px;background:var(--bg)}
.sq-meta::before{left:-8px;border-radius:0 50% 50% 0}
.sq-meta::after{right:-8px;border-radius:50% 0 0 50%}
.sq-meta span{transition:opacity .25s}
.sq-qr{position:absolute;inset:0;background:#fff;display:flex;justify-content:center;align-items:center;gap:20px;opacity:0;pointer-events:none;transition:opacity .25s;padding:20px}
.sq-qr img{width:130px;height:130px;flex:none}
.sq-qr p{font-size:14px;line-height:1.7;color:var(--muted);margin:0}
.sq-card:hover .sq-qr{opacity:1}
.sq-card:hover .sq-logo,.sq-card:hover .sq-title,.sq-card:hover .sq-desc,.sq-card:hover .sq-tags,.sq-card:hover .sq-meta span{opacity:0}
.sq-card:hover .sq-meta{border-top-color:#fff}
@media(max-width:640px){.sq-logo{display:none}.sq-title{padding-right:0}.sq-body{padding:20px 20px 16px}.sq-meta{margin:auto -20px 0}}
.foot{text-align:center;color:var(--muted);font-size:12px;line-height:1.8;padding:28px 16px}
.foot a{color:var(--green)}
</style>
</head>

function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var curTab=0,curFilter='all';
function renderTabs(){
 document.getElementById('tabs').innerHTML=DATA.tabs.map(function(t,i){
  return '<div class="tab-item'+(i===curTab?' on':'')+'" data-i="'+i+'"><span class="tab-line"></span><img src="'+esc(t.icon)+'" alt=""><span>'+esc(t.name)+'</span></div>';
 }).join('');
 document.querySelectorAll('#tabs .tab-item').forEach(function(b){
  b.onclick=function(){curTab=parseInt(b.dataset.i,10);curFilter='all';renderFilters();renderGrid();renderTabs();};
 });
}
function renderFilters(){
 var fs=DATA.tabs[curTab].filters;
 document.getElementById('filters').innerHTML=fs.map(function(f){
  return '<span class="'+(f[0]===curFilter?'on':'')+'" data-f="'+f[0]+'">'+esc(f[1])+'</span>';
 }).join('');
 document.querySelectorAll('#filters span').forEach(function(b){
  b.onclick=function(){curFilter=b.dataset.f;renderFilters();renderGrid();};
 });
}
function renderGrid(){
 var list=DATA.cards.filter(function(c){
  if(c.tab!==curTab)return false;
  if(curFilter==='all')return true;
  return c.tagClasses.indexOf(curFilter)>=0;
 });
 document.getElementById('grid').innerHTML=list.map(function(c){
  return '<a class="sq-card" href="'+esc(c.href)+'" target="_blank" rel="noopener">'
   +'<div class="sq-body"><div class="sq-logo"><img src="'+esc(c.logo)+'" alt="'+esc(c.logoAlt)+'"></div>'
   +'<div class="sq-title">'+esc(c.title)+'</div>'
   +'<p class="sq-desc">'+esc(c.desc)+'</p>'
   +'<div class="sq-tags">'+c.tags.map(function(t){return '<span>'+esc(t)+'</span>';}).join('')+'</div>'
   +'<div class="sq-meta"><span>扫码领取</span></div></div>'
   +'<div class="sq-qr"><img src="'+esc(c.qr)+'" alt="二维码"><p>打开手机<br>扫一扫领取</p></div></a>';
 }).join('');
}
renderTabs();renderFilters();renderGrid();
