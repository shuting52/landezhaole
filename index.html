.corner-tag.hot,.corner-tag.new,.corner-tag.rec{background:linear-gradient(90deg,#ef4444,#f97316,#eab308,#22c55e,#06b6d4,#3b82f6,#a855f7);background-size:100% 100%}
.avatar{position:relative;width:44px;height:44px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;overflow:hidden;font-size:16px}

.info{min-width:0;flex:1}
.name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;min-width:0}
.ntext{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

.badge.hot{background:var(--orange)} .badge.new{background:var(--red)} .badge.rec{background:var(--green)}
.desc{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#results{display:none} #results.show{display:block}
.empty{text-align:center;color:var(--muted);padding:40px}

#topUtils{position:fixed;left:12px;right:auto;top:50%;transform:translateY(-50%);z-index:99;padding:0;display:flex;flex-direction:column;align-items:center;gap:10px}
#topUtils::before{content:none}

.share-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.share-overlay.show{display:flex}
.share-dialog{background:var(--card);color:var(--text);border-radius:18px;max-width:420px;width:100%;padding:28px 24px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.share-title{font-size:20px;font-weight:800;color:var(--green);margin-bottom:12px}

.share-dialog .actions{margin-top:20px}

footer{margin-top:36px;padding:28px 0 44px;text-align:center;color:var(--muted);font-size:12px}

.toast-notify .tt{font-size:14px;font-weight:700}

.toast-close{position:absolute;top:4px;right:8px;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:2px}

.top-utils::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,0) 42%)}

.optic-switch{display:inline-flex;position:relative;font-size:10px;width:20em;height:7em;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.optic-input{display:none}
.optic-ambient{position:absolute;top:-3em;left:-2em;width:11em;bottom:-3em;background-color:rgba(255,59,48,0.12);border-radius:50%;filter:blur(2.5em);transition:transform 0.7s cubic-bezier(0.85,0,0.15,1),background-color 0.5s ease;pointer-events:none;z-index:0}
.optic-input:checked~.optic-ambient{transform:translateX(13em);background-color:rgba(0,212,255,0.2)}
.optic-track{position:absolute;top:0px;left:0px;width:100%;height:100%;background:linear-gradient(180deg,#e2e8f0,#f8fafc);border-radius:3.5em;box-shadow:inset 0px 0.2em 0.6em rgba(0,0,0,0.1),inset 0px -0.1em 0.2em rgba(255,255,255,0.8),0px 0.5em 1em rgba(0,0,0,0.05);overflow:hidden;z-index:1;transition:transform 0.2s cubic-bezier(0.2,0.8,0.2,1)}
.optic-switch:active .optic-track{transform:scale(0.97)}
.optic-rim{position:absolute;top:0px;left:0px;right:0px;bottom:0px;border-radius:3.5em;border:0.1em solid #ffffff;pointer-events:none;z-index:10}
.optic-fiber{position:absolute;top:3.35em;left:3.5em;right:3.5em;height:0.3em;background-color:#cbd5e1;border-radius:0.15em;box-shadow:inset 0px 0.1em 0.2em rgba(0,0,0,0.15),0px 0.1em 0.1em rgba(255,255,255,0.9);z-index:1;overflow:hidden}
.optic-fiber-fill{height:100%;width:0%;background:linear-gradient(90deg,#007aff,#00d4ff);border-radius:0.15em;box-shadow:0px 0px 0.8em rgba(0,212,255,0.6);transition:width 0.7s cubic-bezier(0.85,0,0.15,1)}
.optic-input:checked~.optic-track .optic-fiber .optic-fiber-fill{width:100%}
.optic-node{position:absolute;top:2.5em;width:2em;height:2em;border-radius:50%;background-color:#f1f5f9;box-shadow:inset 0px 0.1em 0.3em rgba(0,0,0,0.1),0px 0.1em 0.1em rgba(255,255,255,1);display:flex;align-items:center;justify-content:center;z-index:2}
.optic-node-left{left:2.5em}
.optic-node-right{right:2.5em}
.optic-node-dot{width:0.4em;height:0.4em;border-radius:50%;background-color:#94a3b8;box-shadow:inset 0px 0.1em 0.1em rgba(0,0,0,0.1);transition:background-color 0.4s ease,box-shadow 0.4s ease}
.optic-input:not(:checked)~.optic-track .optic-node-left .optic-node-dot{background-color:#ff3b30;box-shadow:0px 0px 0.5em rgba(255,59,48,0.6)}
.optic-input:checked~.optic-track .optic-node-right .optic-node-dot{background-color:#00d4ff;box-shadow:0px 0px 0.5em rgba(0,212,255,0.6)}
.optic-shuttle{position:absolute;top:0.5em;left:0.5em;width:6em;height:6em;z-index:5;transition:transform 0.7s cubic-bezier(0.85,0,0.15,1);display:flex;align-items:center;justify-content:center}
.optic-input:checked~.optic-track .optic-shuttle{transform:translateX(13em)}
.optic-chassis{position:absolute;top:0px;left:0px;width:100%;height:100%;border-radius:50%;background:linear-gradient(135deg,#ffffff,#e2e8f0);box-shadow:inset 0px 0.1em 0.2em rgba(255,255,255,1),inset 0px -0.2em 0.5em rgba(0,0,0,0.05),0px 0.3em 0.6em rgba(0,0,0,0.15);display:flex;align-items:center;justify-content:center;transition:transform 0.7s cubic-bezier(0.85,0,0.15,1)}
.optic-input:checked~.optic-track .optic-shuttle .optic-chassis{transform:rotate(360deg)}
.optic-mark{position:absolute;background-color:#cbd5e1;border-radius:0.15em;box-shadow:inset 0px 0.1em 0.2em rgba(0,0,0,0.1),0px 0.1em 0.1em rgba(255,255,255,1)}
.optic-mark-vertical{width:0.3em;height:1em}
.optic-mark-horizontal{width:1em;height:0.3em}
.optic-m1{top:0.4em}
.optic-m2{bottom:0.4em}
.optic-m3{left:0.4em}
.optic-m4{right:0.4em}
.optic-aperture{width:3.5em;height:3.5em;border-radius:50%;background-color:#f8fafc;border:0.2em solid #e2e8f0;box-shadow:inset 0px 0.3em 0.6em rgba(0,0,0,0.1),0px 0.1em 0.2em rgba(255,255,255,1);display:flex;align-items:center;justify-content:center;position:relative;z-index:2;transition:border-color 0.5s ease,box-shadow 0.5s ease;overflow:hidden}
.optic-input:checked~.optic-track .optic-shuttle .optic-chassis .optic-aperture{border-color:rgba(0,212,255,0.4);box-shadow:inset 0px 0.3em 0.6em rgba(0,0,0,0.1),0px 0px 0.8em rgba(0,212,255,0.2)}
.optic-pupil{width:100%;height:100%;border-radius:50%;background-color:#ff3b30;box-shadow:0px 0px 0.4em rgba(255,59,48,0.6),inset 0px 0px 0.2em rgba(255,255,255,0.6);border:1.5em solid #ffffff;transition:border-width 0.6s cubic-bezier(0.85,0,0.15,1),background-color 0.4s ease,box-shadow 0.4s ease;box-sizing:border-box}
.optic-input:checked~.optic-track .optic-shuttle .optic-chassis .optic-aperture .optic-pupil{border-width:0.3em;background-color:#00d4ff;box-shadow:0px 0px 1.2em 0.3em rgba(0,212,255,0.6),inset 0px 0px 0.6em rgba(255,255,255,0.9)}
.optic-lens{position:absolute;top:0px;left:0px;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 35% 25%,rgba(255,255,255,0.6) 0%,transparent 40%,rgba(0,0,0,0.08) 100%);z-index:3;pointer-events:none}
.topbar .optic-switch{font-size:4px;vertical-align:middle;flex:none}
.theme-pick-btn{position:relative;width:64px;height:26px;border:none;background:rgb(231,0,0);display:inline-flex;align-items:center;justify-content:center;overflow-y:hidden;border-radius:0;cursor:pointer;box-shadow:3px 3px 0 rgb(12,12,12);transition-duration:.3s;vertical-align:middle;flex:none}
.theme-pick-btn .layer{width:36px;position:absolute;left:-18px;top:50%;transform:translateY(-50%);transition-duration:.3s;fill:#ffaf02}
.theme-pick-btn:hover{transform:translateY(2px);box-shadow:1px 1px 0 rgb(0,0,0)}
.theme-pick-btn:hover .layer{left:0;width:100%}
.theme-pick-btn p{color:#fff;font-weight:600;font-size:13px;position:relative;z-index:2;transition-duration:.1s;margin:0}
.theme-pick-btn:hover p{color:transparent;transition-duration:.3s}
.theme-panel{position:fixed;top:44px;right:8px;z-index:120;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.25);padding:12px;display:none;grid-template-columns:repeat(3,84px);gap:10px}
.theme-panel.open{display:grid}
.theme-opt{position:relative;height:34px;border:none;display:flex;align-items:center;justify-content:center;overflow-y:hidden;border-radius:0;cursor:pointer;box-shadow:3px 3px 0 rgb(12,12,12);transition-duration:.3s;color:#fff;font-weight:700;font-size:13px}
.theme-opt .layer{position:absolute;left:-14px;top:0;bottom:0;width:28px;background:#ffaf02;transition-duration:.3s}
.theme-opt:hover{transform:translateY(2px);box-shadow:1px 1px 0 rgb(0,0,0)}
.theme-opt:hover .layer{left:0;width:100%}
.theme-opt span{position:relative;z-index:2;transition-duration:.1s}
.theme-opt:hover span{color:transparent;transition-duration:.3s}
.theme-opt.on{outline:2px solid var(--green);outline-offset:2px}
@media(max-width:640px){.theme-pick-btn{width:54px;height:24px}.theme-pick-btn p{font-size:12px}.theme-panel{right:8px;left:8px;grid-template-columns:repeat(3,1fr)}}

#topUtils .u-hint{display:none}

#topUtils.fan{display:block;width:56px;height:56px;overflow:visible}

#topUtils.fan a:nth-child(3){transition-delay:.1s}
#topUtils.fan a:nth-child(4){transition-delay:.15s}
#topUtils.fan a:nth-child(5){transition-delay:.2s}
#topUtils.fan:hover a:nth-child(1),#topUtils.fan.fan-open a:nth-child(1){transform:translate(60px,-112px)}

#topUtils.fan:hover a:nth-child(3),#topUtils.fan.fan-open a:nth-child(3){transform:translate(100px,0px)}
#topUtils.fan:hover a:nth-child(4),#topUtils.fan.fan-open a:nth-child(4){transform:translate(92px,56px)}
#topUtils.fan:hover a:nth-child(5),#topUtils.fan.fan-open a:nth-child(5){transform:translate(60px,112px)}
#topUtils.fan a::after{content:attr(data-label);position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%);background:#1f2937;color:#fff;font-size:12px;padding:4px 10px;border-radius:999px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
#topUtils.fan a:hover::after{opacity:1}
@media(max-width:1360px){
#topUtils.fan:hover a:nth-child(1),#topUtils.fan.fan-open a:nth-child(1){transform:translate(64px,-56px)}
#topUtils.fan:hover a:nth-child(2),#topUtils.fan.fan-open a:nth-child(2){transform:translate(96px,-112px)}
#topUtils.fan:hover a:nth-child(3),#topUtils.fan.fan-open a:nth-child(3){transform:translate(104px,-168px)}
#topUtils.fan:hover a:nth-child(4),#topUtils.fan.fan-open a:nth-child(4){transform:translate(96px,-224px)}
#topUtils.fan:hover a:nth-child(5),#topUtils.fan.fan-open a:nth-child(5){transform:translate(64px,-280px)}
}

const AI_API_MAP={
 official:['openai','google','anthropic','aliyun','baidu','tencent','volc','zhipu','moonshot','deepseek','minimax','step','xfyun','huawei','baichuan','yi','kunlun','jimeng','github','perplexity'],

let DATA=null,curEngine='site';
const AV_COLORS=['#16a34a','#0ea5e9','#8b5cf6','#f59e0b','#ef4444','#ec4899','#14b8e6','#f97316'];
function avColor(t){let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))>>>0;return AV_COLORS[h%AV_COLORS.length];}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hostOf(u){try{return new URL(u).hostname.replace(/^www\./,'');}catch(e){return '';}}
function iconNext(img){
 const host=img.dataset.host;const step=parseInt(img.dataset.step||'0',10);
 const next=['https://'+host+'/apple-touch-icon.png','https://'+host+'/favicon.ico'];
 if(step<next.length){img.dataset.step=step+1;img.src=next[step];}
 else img.remove();
}
// 只跳过谷歌那道源的小地球兜底图（16px）；站点自己的图标哪怕只有16px也是真 logo，要留着，别换成兜底
function iconCheck(img){if(img.dataset.from==='override')return;if(img.dataset.step==='0'&&img.naturalWidth&&img.naturalWidth<32)iconNext(img);}
function cardHTML(c){
 const host=hostOf(c.u);
 const firstIcon=c.i?esc(c.i):`https://www.google.com/s2/favicons?domain=${esc(host)}&sz=128`;
 const av=`<div class="avatar" style="background:${avColor(c.t)}"><img src="${firstIcon}" loading="lazy" alt="" data-host="${esc(host)}" data-step="0" ${c.i?'data-from="override"':''} onerror="iconNext(this)" onload="iconCheck(this)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg></div>`;
 let corner='';
 if(c.b){const cls=/HOT/i.test(c.b)?'hot':/NEW/i.test(c.b)?'new':'rec';corner=`<span class="corner corner-tag ${cls}">${esc(c.b)}</span>`;}
 else corner=`<span class="corner corner-tag">精选</span>`;
 return `<div class="card-wrap"><a class="card" href="${esc(c.u)}" target="_blank" rel="noopener">${av}<div class="info"><div class="name"><span class="ntext">${esc(c.t)}</span></div><div class="desc">${esc(c.d)}</div></div></a>${corner}<span class="click-tip">👁 今日点击 <em>0</em> 次</span></div>`;
}
function matchSub(cat,card,sub){
 if(sub==='all') return true;
 if(cat.id==='ai_api') return (AI_API_MAP[sub]||[]).includes(card.s);
 return card.s===sub;
}
function renderCat(cat){
 const tabs=cat.subs.map(s=>`<button data-sub="${s.id}"${s.id==='all'?' class="on"':''}>${esc(s.name)}</button>`).join('');
 return `<section class="cat" id="cat-${cat.id}"><div class="cat-head"><span class="cat-dot"></span><span class="cat-title">${esc(cat.name)}</span><span class="cat-count">${cat.cards.length} 个站点</span></div>${cat.desc?`<div class="cat-desc">${esc(cat.desc)}</div>`:''}<div class="tabs">${tabs}</div><div class="grid"></div></section>`;
}
function fillGrid(section,cat,sub){
 const list=cat.cards.filter(c=>matchSub(cat,c,sub));
 section.querySelector('.grid').innerHTML=list.map(cardHTML).join('');
 applyRowCap(section,cat,sub);
}
function applyRowCap(sec,cat,sub){
 const grid=sec.querySelector('.grid');if(!grid)return;
 grid.querySelectorAll('.more-bar').forEach(b=>b.remove());
 const wraps=grid.querySelectorAll('.card-wrap');
 wraps.forEach(w=>{w.style.display='';});
 if(!wraps.length)return;
 const cols=getComputedStyle(grid).gridTemplateColumns.split(' ').filter(Boolean).length||1;
 const limit=cols*4-1;
 if(wraps.length<=limit)return;
 wraps.forEach((w,i)=>{if(i>=limit)w.style.display='none';});
 const bar=document.createElement('a');
 bar.className='more-bar';
 bar.href='cat.html?cat='+encodeURIComponent(cat.id)+'&sub='+encodeURIComponent(sub);
 bar.textContent='→ 查看更多';
 grid.appendChild(bar);
}
function applyAllCaps(){
 if(!DATA)return;
 document.querySelectorAll('#cats section.cat').forEach(sec=>{
   if(sec.dataset.filled!=='1')return;
   const cat=DATA.cats.find(c=>c.id===sec.id.replace(/^cat-/,''));
   if(!cat)return;
   const on=sec.querySelector('.tabs button.on');
   applyRowCap(sec,cat,on?on.dataset.sub:'all');
 });
}
function render(){
 const box=document.getElementById('cats');
 const total=DATA.cats.reduce((n,c)=>n+c.cards.length,0);
 document.getElementById('quickDock').innerHTML=DATA.cats.slice(0,10).map(c=>`<a class="qapp" href="#cat-${c.id}" data-label="${esc(c.name)}" aria-label="${esc(c.name)}"><div class="qicon" style="background:${avColor(c.name)}">${esc(c.name.trim()[0])}</div></a>`).join('');
 bindQuickDock();
 box.innerHTML=DATA.cats.map(renderCat).join('');
 showNewSiteToasts();
 updateRankCard();
 const secs=box.querySelectorAll('section.cat');
 secs.forEach((sec,i)=>{
   const cat=DATA.cats[i];
   sec.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
     sec.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
     sec.dataset.filled='1';fillGrid(sec,cat,b.dataset.sub);
   });
 });
 // 懒加载：首屏只渲染第 1 个分类，其余分类滑到附近（400px 内）才渲染卡片与拉图标，避免一次建 2436 张卡 + 2436 个 favicon 请求卡死首屏
 if(secs.length)fillGrid(secs[0],DATA.cats[0],'all');
 if('IntersectionObserver' in window){
   const io=new IntersectionObserver((es)=>{
     es.forEach(e=>{
       if(!e.isIntersecting)return;
       const sec=e.target,idx=Array.prototype.indexOf.call(secs,sec);
       if(sec.dataset.filled!=='1'){sec.dataset.filled='1';fillGrid(sec,DATA.cats[idx],'all');}
       io.unobserve(sec);
     });
   },{rootMargin:'400px 0px'});
   secs.forEach((sec,i)=>{if(i>0)io.observe(sec);});
 } else {
   secs.forEach((sec,i)=>{if(i>0)fillGrid(sec,DATA.cats[i],'all');});
 }
 if(!window.__capResizeBound){window.__capResizeBound=true;let capT=null;window.addEventListener('resize',()=>{clearTimeout(capT);capT=setTimeout(applyAllCaps,200);});}
}
function bindQuickDock(){
 const dock=document.getElementById('quickDock'),tip=document.getElementById('quickTip'),wrap=document.getElementById('quickWrap');
 const apps=Array.prototype.slice.call(dock.querySelectorAll('.qapp'));
 let SIGMA=62;const MAX=1.5;
 function gauss(d){return Math.exp(-(d*d)/(2*SIGMA*SIGMA));}
 let rafPending=false,lastMx=0;
 function renderDockFrame(){
   rafPending=false;
   const dockLeft=dock.getBoundingClientRect().left;
   apps.forEach(function(a){
     const cx=dockLeft+a.offsetLeft+a.offsetWidth/2,d=Math.abs(lastMx-cx);
     const s=1+(MAX-1)*gauss(d),lift=(s-1)*34;
     a.style.transform='scale('+s.toFixed(3)+') translateY('+(-lift).toFixed(1)+'px)';
   });
 }
 function renderDock(mx){lastMx=mx;if(!rafPending){rafPending=true;requestAnimationFrame(renderDockFrame);}}
 function resetDock(){apps.forEach(function(a){a.style.transform='scale(1) translateY(0)';});tip.classList.remove('show');}
 let lastPt=0;
 function trailPt(x,y){
   const now=performance.now();if(now-lastPt<60)return;lastPt=now;
   const pts=wrap.querySelectorAll('.pt');if(pts.length>=24)pts[0].remove();
   const r=wrap.getBoundingClientRect();const s=document.createElement('span');s.className='pt';s.style.left=(x-r.left-4)+'px';s.style.top=(y-r.top-4)+'px';wrap.appendChild(s);setTimeout(function(){s.remove();},950);
 }
 dock.addEventListener('mousemove',function(e){renderDock(e.clientX);trailPt(e.clientX,e.clientY);});
 dock.addEventListener('mouseleave',resetDock);
 dock.addEventListener('touchmove',function(e){if(e.touches.length){renderDock(e.touches[0].clientX);}}, {passive:true});
 dock.addEventListener('touchend',resetDock);
 apps.forEach(function(a){a.addEventListener('mouseenter',function(){tip.textContent=a.getAttribute('data-label');tip.classList.add('show');});a.addEventListener('click',function(){clearSearch();});});
 function adapt(){if(apps.length>1){const r0=apps[0].getBoundingClientRect(),r1=apps[1].getBoundingClientRect();SIGMA=Math.max(46,(r1.left-r0.left)*0.85);}}
 window.addEventListener('resize',adapt);adapt();
}
function showNewSiteToasts(){
 const toast=document.getElementById('toastNotify');if(!toast)return;
 let seen=[];try{seen=JSON.parse(localStorage.getItem('landezhaole-seen-new')||'[]');}catch(e){seen=[];}
 const news=[];
 DATA.cats.forEach(cat=>cat.cards.forEach(c=>{if(/NEW/i.test(c.b||'')&&!seen.includes(c.u))news.push(c);}));
 if(!news.length)return;
 let stopped=false;
 document.getElementById('toastClose').onclick=function(e){e.stopPropagation();stopped=true;toast.style.visibility='hidden';};
 function tw(dur,update,done){
   const n=Math.max(1,Math.round(dur/16));let i=0;
   (function tick(){i++;const p=Math.min(1,i/n);update(p);if(p<1){setTimeout(tick,16);}else if(done){done();}})();
 }
 function easeOutQuad(x){return 1-(1-x)*(1-x);}
 toast.onclick=function(){if(news[0])window.open(news[0].u,'_blank');};
 function show(cb){
   toast.style.visibility='visible';toast.style.opacity='1';
   document.getElementById('toastIc').textContent='新';
   document.getElementById('toastTt').textContent='站点上新';
   document.getElementById('toastBd').textContent='「'+news.map(n=>n.t).join('、')+'」已加入站点导航，去看看';
   tw(560,function(p){const e=easeOutQuad(p);toast.style.transform='translateX('+(400*(1-e)).toFixed(1)+'px) skewX('+(-12*(1-e)).toFixed(2)+'deg)';},cb);
 }
 function hide(cb){
   tw(400,function(p){const e=p*p;toast.style.transform='translateX('+(-e*420).toFixed(1)+'px) skewX('+(e*10).toFixed(2)+'deg)';toast.style.opacity=(1-p).toFixed(2);},function(){toast.style.visibility='hidden';cb();});
 }
 show(function(){
   setTimeout(function(){
     if(stopped)return;
     news.forEach(n=>seen.push(n.u));try{localStorage.setItem('landezhaole-seen-new',JSON.stringify(seen));}catch(e){}
     hide(function(){});
   },3500);
 });
}
let appDlSeq=0;
function fmtSize(b){if(!b)return '';return (b/1048576).toFixed(1)+' MB';}
function appDlCard(a){

}

async function fetchAppPage(q,offset){
 const worker='https://landezhaole-app-proxy.307779523.workers.dev/?q='+encodeURIComponent(q)+'&offset='+offset;
 const api='https://appteka.store/api/1/app/search?query='+encodeURIComponent(q)+'&locale=en&offset='+offset;
 for(const u of [worker,'https://api.allorigins.win/raw?url='+encodeURIComponent(api)]){
   try{const r=await fetch(u);if(!r.ok)continue;const j=await r.json();
     if(j&&Array.isArray(j.entries))return {total:j.total||j.entries.length,entries:j.entries};
     if(j&&j.status===200&&j.result&&Array.isArray(j.result.entries))return {total:j.result.total||j.result.entries.length,entries:j.result.entries};
   }catch(e){}
 }
 return null;
}
function appDlRefreshMore(){
 const more=document.getElementById('appDlMore');
 const left=appDlTotal-appDlShown;
 more.style.display=left>0?'':'none';
 more.textContent=appDlLoading?'正在找…':'找更多（已显示 '+appDlShown+' / '+appDlTotal+'）';
}
function appDlShowBatch(){
 const grid=document.getElementById('appDlGrid');
 const batch=appDlCache.slice(appDlShown,appDlShown+12);
 grid.insertAdjacentHTML('beforeend',batch.map(appDlCard).join(''));
 appDlShown+=batch.length;
 document.getElementById('appDlCount').textContent='共 '+appDlTotal+' 个应用，已显示 '+appDlShown+' 个';
 appDlRefreshMore();
}
async function appDlLoadMore(){
 if(appDlLoading)return;appDlLoading=true;appDlRefreshMore();
 try{
   if(appDlShown<appDlCache.length){appDlShowBatch();}
   else if(appDlNextOffset<appDlTotal){
     const page=await fetchAppPage(appDlQ,appDlNextOffset);
     if(page){appDlCache=appDlCache.concat(page.entries);appDlNextOffset+=96;appDlShowBatch();}
     else document.getElementById('appDlStatus').textContent='找更多失败，稍后再试。';
   }
 }finally{appDlLoading=false;appDlRefreshMore();}
}
async function renderAppDl(q){
 const seq=++appDlSeq,sec=document.getElementById('appDlSec'),grid=document.getElementById('appDlGrid'),st=document.getElementById('appDlStatus');
 sec.style.display='';grid.innerHTML='';st.textContent='正在搜应用 “'+q+'”…';document.getElementById('appDlNote').textContent='';
 appDlQ=q;appDlCache=[];appDlShown=0;appDlNextOffset=0;appDlTotal=0;
 const page=await fetchAppPage(q,0);
 if(seq!==appDlSeq)return;
 if(!page){st.textContent='应用搜索暂时不可用，换个关键词或稍后再试。';appDlRefreshMore();return;}
 appDlCache=page.entries;appDlTotal=page.total;appDlNextOffset=96;
 st.textContent='点“下载 APK”在本页直接下载，不跳走；跑满后文件进系统下载目录，点开即可安装。';
 appDlShowBatch();
}
function appDlCardDownload(card){
 const wrap=card.closest('.card-wrap');if(!wrap)return;
 const btn=wrap.querySelector('.apk-btn');if(!btn||btn.dataset.busy==='1')return;
 const m=btn.getAttribute('onclick')||'';
 // 从按钮的 onclick 里取参数，避免再拼一遍
 const mm=m.match(/startAppDownload\(this,'([^']*)','([^']*)',(\d+)\)/);
 if(mm)startAppDownload(btn,mm[1],mm[2],parseInt(mm[3],10)||0);
}
function fmtMB(b){return (b/1048576).toFixed(1)+' MB';}
async function startAppDownload(btn,appId,label,size){
 const wrap=btn.closest('.card-wrap');if(!wrap)return;
 if(btn.dataset.busy==='1'){if(btn._dlCtrl)btn._dlCtrl.abort();btn.dataset.cancel='1';return;}
 btn.dataset.busy='1';btn.dataset.cancel='';btn.textContent='下载中…';const dlCtrl=new AbortController();btn._dlCtrl=dlCtrl;
 let prog=wrap.querySelector('.apk-prog');
 if(!prog){prog=document.createElement('div');prog.className='apk-prog';prog.innerHTML='<div class="apk-bar"><i></i></div><div class="apk-text">准备下载…</div><button type="button" class="apk-cancel">取消</button>';btn.after(prog);}
 const bar=prog.querySelector('.apk-bar i'),txt=prog.querySelector('.apk-text'),cancel=prog.querySelector('.apk-cancel');
 cancel.onclick=()=>{txt.textContent='正在取消…';dlCtrl.abort();btn.dataset.cancel='1';};
 const total=size||0;
 if(!total){txt.textContent='拿不到文件大小，下载失败。';btn.dataset.busy='';btn.textContent='⬇ 下载 APK';return;}
 // zip 下载器思路的网页版：8MB 以下单段，8MB 以上按 4MB 分段、4 路并行、段失败重试（200ms 起翻倍）
 const SEG=4*1024*1024, segCount=total<8*1024*1024?1:Math.ceil(total/SEG);
 const parts=new Array(segCount);let nextSeg=0,received=0;const t0=Date.now();
 const upd=()=>{const pct=Math.floor(received/total*100);bar.style.width=pct+'%';txt.textContent=pct+'% · '+fmtMB(received)+' / '+fmtMB(total)+' · '+(received/Math.max(1,(Date.now()-t0)/1000)/1048576).toFixed(1)+' MB/s';btn.textContent='下载中 '+pct+'%';};
 async function fetchSeg(idx){
   const start=idx*SEG,end=Math.min(total, start+SEG)-1;
   for(let attempt=0;attempt<3;attempt++){
     if(btn.dataset.cancel==='1')return false;
     try{
       const r=await fetch('https://landezhaole-app-proxy.307779523.workers.dev/segment?app_id='+encodeURIComponent(appId)+'&start='+start+'&end='+end,{signal:dlCtrl.signal});
       if(!r.ok)throw new Error('seg '+r.status);
       const buf=await r.arrayBuffer();parts[idx]=buf;received+=buf.byteLength;upd();return true;
     }catch(e){if(dlCtrl.signal.aborted||btn.dataset.cancel==='1')return false;await new Promise(res=>setTimeout(res,200*(1<<attempt)));}
   }
   return false;
 }
 let ok=true;
 const lanes=Array.from({length:Math.min(8,segCount)},async()=>{
   while(nextSeg<segCount){
     if(btn.dataset.cancel==='1')break;
     const idx=nextSeg++;
     if(!(await fetchSeg(idx))){ok=false;break;}
   }
 });
 await Promise.all(lanes);
 if(btn.dataset.cancel==='1'||dlCtrl.signal.aborted){txt.textContent='已取消。';btn.dataset.busy='';btn._dlCtrl=null;btn.textContent='⬇ 下载 APK';return;}
 if(!ok||parts.some(p=>!p)){txt.textContent='下载失败，点“下载 APK”重试。';btn.dataset.busy='';btn._dlCtrl=null;btn.textContent='⬇ 下载 APK';return;}
 const blob=new Blob(parts,{type:'application/vnd.android.package-archive'});
 const url=URL.createObjectURL(blob);const a=document.createElement('a');
 a.href=url;a.download='懒得找了.apk';document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),60000);
 bar.style.width='100%';txt.textContent='已下载到系统下载目录，点开“懒得找了.apk”即可安装（需允许安装未知应用）。';
 btn.dataset.busy='';btn._dlCtrl=null;btn.textContent='已下载，去安装';
}
function doSearch(siteOnly){
 const q=document.getElementById('q').value.trim();
 const res=document.getElementById('results');
 const cats=document.getElementById('cats');
 if(curEngine!=='site'&&curEngine!=='appdl'){ if(q) window.open(ENGINES.find(e=>e.id===curEngine).url+encodeURIComponent(q),'_blank'); return; }
 if(!q){res.classList.remove('show');document.getElementById('appDlSec').style.display='none';if(cats)cats.style.display='';return;}
 if(curEngine==='appdl'){
   document.getElementById('resGrid').innerHTML='';document.getElementById('resEmpty').style.display='none';document.getElementById('resCount').textContent='';
   document.querySelector('#results section.cat').style.display='none';
   if(cats)cats.style.display='none';res.classList.add('show');
   if(!siteOnly)renderAppDl(q);
   return;
 }
 document.querySelector('#results section.cat').style.display='';
 const low=q.toLowerCase();let list=[];
 DATA.cats.forEach(cat=>cat.cards.forEach(c=>{
   const hay=(c.t+' '+c.d+' '+(c.b||'')+' '+c.u+' '+cat.name).toLowerCase();
   if(hay.includes(low))list.push(c);
 }));
 const rank=c=>/NEW/i.test(c.b||'')||/新/i.test(c.b||'')?2:/HOT/i.test(c.b||'')?1:0;
 list.sort((a,b)=>rank(b)-rank(a));
 document.getElementById('resCount').textContent='搜索结果（'+list.length+'）';
 document.getElementById('resGrid').innerHTML=list.map(cardHTML).join('');
 document.getElementById('resEmpty').style.display=list.length?'none':'block';
 if(cats)cats.style.display='none';
 res.classList.add('show');
 if(siteOnly)document.getElementById('appDlSec').style.display='none';
 else renderAppDl(q);
}
function clearSearch(){
 const q=document.getElementById('q');if(q)q.value='';document.getElementById('appDlSec').style.display='none';
 const res=document.getElementById('results');res.classList.remove('show');
 const cats=document.getElementById('cats');if(cats)cats.style.display='';
}
function setEngine(id){
 curEngine=id;
 document.querySelectorAll('#engines button').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
 document.getElementById('q').placeholder=id==='site'?'搜本站资源，或切到必应 / 百度 / B站 / 网盘 / 谷歌搜全网…':id==='appdl'?'搜应用名，直接下载 APK…':'搜全网：'+ENGINES.find(e=>e.id===id).name;
 if(document.getElementById('q').value.trim())doSearch(false);
}
document.getElementById('engines').innerHTML=ENGINES.map(e=>`<button data-id="${e.id}">${e.name}</button>`).join('');
document.querySelectorAll('#engines button').forEach(b=>b.onclick=()=>setEngine(b.dataset.id));
setEngine('site');
document.getElementById('go').onclick=()=>doSearch(false);
document.getElementById('appDlMore').onclick=appDlLoadMore;

document.getElementById('q').addEventListener('input',()=>{if(curEngine==='appdl'){clearTimeout(appDlInputTimer);appDlInputTimer=setTimeout(()=>doSearch(false),700);}else doSearch(true);});
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch(false);});
document.getElementById('today').textContent=new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'short'});
const sw=document.getElementById('opticTheme');
const THEMES=[{v:'light',n:'默认',c:'#16a34a',t:'#fff'},{v:'dark',n:'暗夜',c:'#34d399',t:'#fff'},{v:'hong',n:'大红',c:'#E70000',t:'#fff'},{v:'huang',n:'明黄',c:'#FFAF02',t:'#111'},{v:'lan',n:'宝蓝',c:'#1D4ED8',t:'#fff'},{v:'hei',n:'曜黑',c:'#FFAF02',t:'#111'}];
const themePanel=document.getElementById('themePanel'),themePickBtn=document.getElementById('themePickBtn');
themePanel.innerHTML=THEMES.map(t=>`<button class="theme-opt" data-v="${t.v}" style="background:${t.c};color:${t.t}" role="menuitem"><span class="layer"></span><span>${t.n}</span></button>`).join('');
function applyTheme(v){document.documentElement.dataset.theme=v;try{localStorage.setItem('landezhaole-theme',v);}catch(e){}sw.checked=(v==='dark'||v==='hei');themePanel.querySelectorAll('.theme-opt').forEach(b=>b.classList.toggle('on',b.dataset.v===v));}

if(['light','dark','hong','huang','lan','hei'].indexOf(saved)<0){saved='light';try{localStorage.setItem('landezhaole-theme','light');}catch(e){}}
if(saved){document.documentElement.dataset.theme=saved;sw.checked=saved==='dark'||saved==='hei';}
themePanel.querySelectorAll('.theme-opt').forEach(b=>{if(b.dataset.v===document.documentElement.dataset.theme)b.classList.add('on');b.onclick=()=>{applyTheme(b.dataset.v);themePanel.classList.remove('open');themePickBtn.setAttribute('aria-expanded','false');};});
sw.onchange=()=>{applyTheme(sw.checked?'dark':'light');};
themePickBtn.onclick=(e)=>{e.stopPropagation();const open=themePanel.classList.toggle('open');themePickBtn.setAttribute('aria-expanded',open);};
document.addEventListener('click',(e)=>{if(!themePanel.contains(e.target)&&e.target!==themePickBtn){themePanel.classList.remove('open');themePickBtn.setAttribute('aria-expanded','false');}});
document.addEventListener('keydown',(e)=>{if(e.key==='Escape'){themePanel.classList.remove('open');themePickBtn.setAttribute('aria-expanded','false');}});
const fanBar=document.getElementById('topUtils'),fanMain=document.getElementById('fanMain');
if(fanBar&&fanMain){fanMain.onclick=(e)=>{e.stopPropagation();fanBar.classList.toggle('fan-open');};
fanBar.querySelectorAll('.fan-items a').forEach(a=>a.addEventListener('click',()=>fanBar.classList.remove('fan-open')));
document.addEventListener('click',()=>fanBar.classList.remove('fan-open'));}
function showSideToast(msg){

 document.getElementById('toastTt').textContent='分享';

 setTimeout(()=>{toast.style.visibility='hidden';},2500);
}
document.getElementById('sideShareBtn').onclick=async()=>{
 const url=location.href;
 let ok=false;
 try{ await navigator.clipboard.writeText(url); ok=true; }
 catch(e){
  try{
   const ta=document.createElement('textarea');ta.value=url;ta.style.position='fixed';ta.style.opacity='0';
   document.body.appendChild(ta);ta.select();ok=document.execCommand('copy');ta.remove();
  }catch(_){ ok=false; }
 }
 if(ok){ document.getElementById('shareOverlay').classList.add('show'); }
 else{ showSideToast('复制失败，请手动复制地址栏链接'); }
};

function todayClickKey(){return 'landezhaole-clicks-'+new Date().toLocaleDateString('en-CA');}
function getTodayClicks(url){try{return (JSON.parse(localStorage.getItem(todayClickKey())||'{}')[url]||0);}catch(e){return 0;}}
function recordTodayClick(url){try{const k=todayClickKey();const d=JSON.parse(localStorage.getItem(k)||'{}');d[url]=(d[url]||0)+1;localStorage.setItem(k,JSON.stringify(d));}catch(e){}}
function updateRankCard(){
 const rc=document.getElementById('rankCard');if(!rc||!DATA)return;
 document.getElementById('rankTotal').textContent=DATA.cats.reduce((n,c)=>n+c.cards.length,0);
 let best=null,bestN=0;
 document.querySelectorAll('a.card').forEach(function(a){
   const n=getTodayClicks(a.href);
   if(n>bestN){bestN=n;best=a;}
 });
 const nameEl=document.getElementById('rankName'),iconEl=document.getElementById('rankIcon'),clickEl=document.getElementById('rankClicks');
 if(best){
   const nt=best.querySelector('.ntext');nameEl.textContent=nt?nt.textContent:'';
   const img=best.querySelector('.avatar img');iconEl.src=img?img.src:'icon.png';
   clickEl.textContent=bestN;
 }else{
   nameEl.textContent='今日暂无点击';iconEl.src='icon.png';clickEl.textContent='0';
 }
}
document.addEventListener('mouseover',function(e){
 const wrap=e.target.closest?e.target.closest('.card-wrap'):null;if(!wrap)return;
 const tip=wrap.querySelector('.click-tip');const link=wrap.querySelector('.card');
 if(tip&&link)tip.querySelector('em').textContent=getTodayClicks(link.href);
});
document.addEventListener('click',function(e){
 const link=e.target.closest?e.target.closest('.card'):null;if(link){recordTodayClick(link.href);updateRankCard();}
});
