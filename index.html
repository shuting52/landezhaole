<script>
const ENGINES=[
 {id:'site',name:'站内',url:null},
 {id:'bing',name:'必应',url:'https://cn.bing.com/search?q='},
 {id:'baidu',name:'百度',url:'https://www.baidu.com/s?wd='},
 {id:'bilibili',name:'B站',url:'https://search.bilibili.com/all?keyword='},
 {id:'baidupan',name:'百度网盘',url:'https://wangpan.xin/search?keyword='},
 {id:'alipan',name:'阿里云盘',url:'https://v2pan.com/search?q='},
 {id:'quarkpan',name:'夸克网盘',url:'https://www.kkso.cc/search?kw='},
 {id:'google',name:'谷歌',url:'https://www.google.com/search?q='},
 {id:'appdl',name:'应用下载',url:'https://appteka.store/search?q='},
];
// AI API 分类：卡片的厂商 id 映射到官方 / 聚合 / 云服务三个子 Tab
const AI_API_MAP={
 official:['openai','google','anthropic','aliyun','baidu','tencent','volc','zhipu','moonshot','deepseek','minimax','step','xfyun','huawei','baichuan','yi','kunlun','jimeng','github','perplexity'],
 aggregate:['openrouter','groq','together','replicate','huggingface','api2d','gptapi','closeai','pandora','oneapi','newapi'],
 cloud:['cloudflare','azure','aws','gcp'],
};
let DATA=null,curEngine='site';
const AV_COLORS=['#16a34a','#0ea5e9','#8b5cf6','#f59e0b','#ef4444','#ec4899','#14b8e6','#f97316'];
function avColor(t){let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))>>>0;return AV_COLORS[h%AV_COLORS.length];}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hostOf(u){try{return new URL(u).hostname.replace(/^www\./,'');}catch(e){return '';}}
function iconNext(img){
 const host=img.dataset.host;const step=parseInt(img.dataset.step||'0',10);
 const next=['https://icons.duckduckgo.com/ip3/'+host+'.ico','https://'+host+'/favicon.ico'];
 if(step<next.length){img.dataset.step=step+1;img.src=next[step];}
 else img.remove();
}
function iconCheck(img){if(img.naturalWidth&&img.naturalWidth<32)iconNext(img);}
function cardHTML(c){
 const host=hostOf(c.u);
 const av=`<div class="avatar" style="background:${avColor(c.t)}"><img src="https://www.google.com/s2/favicons?domain=${esc(host)}&sz=128" loading="lazy" alt="" data-host="${esc(host)}" data-step="0" onerror="iconNext(this)" onload="iconCheck(this)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg></div>`;
 let corner='';
 if(c.b){const cls=/HOT/i.test(c.b)?'hot':/NEW/i.test(c.b)?'new':'rec';corner=`<span class="corner corner-tag ${cls}">${esc(c.b)}</span>`;}
 else corner=`<span class="corner corner-tag">精选</span>`;
 return `<div class="card-wrap"><a class="card" href="${esc(c.u)}" target="_blank" rel="noopener">${av}<div class="info"><div class="name"><span class="ntext">${esc(c.t)}</span></div><div class="desc">${esc(c.d)}</div></div></a>${corner}<span class="click-tip">👁 今日点击 <em>0</em> 次</span></div>`;
}
function matchSub(cat,card,sub){
 if(sub==='all') return true;
 if(cat.id==='ai_api') return (AI_API_MAP[sub]||[]).includes(card.s);
 return card.s===sub;
}
function renderCat(cat){
 const tabs=cat.subs.map(s=>`<button data-sub="${s.id}"${s.id==='all'?' class="on"':''}>${esc(s.name)}</button>`).join('');
 return `<section class="cat" id="cat-${cat.id}"><div class="cat-head"><span class="cat-dot"></span><span class="cat-title">${esc(cat.name)}</span><span class="cat-count">${cat.cards.length} 个站点</span></div>${cat.desc?`<div class="cat-desc">${esc(cat.desc)}</div>`:''}<div class="tabs">${tabs}</div><div class="grid"></div></section>`;
}
function fillGrid(section,cat,sub){
 const list=cat.cards.filter(c=>matchSub(cat,c,sub));
 section.querySelector('.grid').innerHTML=list.map(cardHTML).join('');
}
function render(){
 const box=document.getElementById('cats');
 const total=DATA.cats.reduce((n,c)=>n+c.cards.length,0);
 document.getElementById('quickDock').innerHTML=DATA.cats.slice(0,10).map(c=>`<a class="qapp" href="#cat-${c.id}" data-label="${esc(c.name)}" aria-label="${esc(c.name)}"><div class="qicon" style="background:${avColor(c.name)}">${esc(c.name.trim()[0])}</div></a>`).join('');
 bindQuickDock();
 box.innerHTML=DATA.cats.map(renderCat).join('');
 showNewSiteToasts();
 checkSiteUpdate();
 const secs=box.querySelectorAll('section.cat');
 secs.forEach((sec,i)=>{
   const cat=DATA.cats[i];
   sec.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
     sec.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
     sec.dataset.filled='1';fillGrid(sec,cat,b.dataset.sub);
   });
 });
 // 懒加载：首屏只渲染第 1 个分类，其余分类滑到附近（400px 内）才渲染卡片与拉图标，避免一次建 2436 张卡 + 2436 个 favicon 请求卡死首屏
 if(secs.length)fillGrid(secs[0],DATA.cats[0],'all');
 if('IntersectionObserver' in window){
   const io=new IntersectionObserver((es)=>{
     es.forEach(e=>{
       if(!e.isIntersecting)return;
       const sec=e.target,idx=Array.prototype.indexOf.call(secs,sec);
       if(sec.dataset.filled!=='1'){sec.dataset.filled='1';fillGrid(sec,DATA.cats[idx],'all');}
       io.unobserve(sec);
     });
   },{rootMargin:'400px 0px'});
   secs.forEach((sec,i)=>{if(i>0)io.observe(sec);});
 } else {
   secs.forEach((sec,i)=>{if(i>0)fillGrid(sec,DATA.cats[i],'all');});
 }
}
function bindQuickDock(){
 const dock=document.getElementById('quickDock'),tip=document.getElementById('quickTip'),wrap=document.getElementById('quickWrap');
 const apps=Array.prototype.slice.call(dock.querySelectorAll('.qapp'));
 let SIGMA=62;const MAX=1.5;
 function gauss(d){return Math.exp(-(d*d)/(2*SIGMA*SIGMA));}
 let rafPending=false,lastMx=0;
 function renderDockFrame(){
   rafPending=false;
   const dockLeft=dock.getBoundingClientRect().left;
   apps.forEach(function(a){
     const cx=dockLeft+a.offsetLeft+a.offsetWidth/2,d=Math.abs(lastMx-cx);
     const s=1+(MAX-1)*gauss(d),lift=(s-1)*34;
     a.style.transform='scale('+s.toFixed(3)+') translateY('+(-lift).toFixed(1)+'px)';
   });
 }
 function renderDock(mx){lastMx=mx;if(!rafPending){rafPending=true;requestAnimationFrame(renderDockFrame);}}
 function resetDock(){apps.forEach(function(a){a.style.transform='scale(1) translateY(0)';});tip.classList.remove('show');}
 let lastPt=0;
 function trailPt(x,y){
   const now=performance.now();if(now-lastPt<60)return;lastPt=now;
   const pts=wrap.querySelectorAll('.pt');if(pts.length>=24)pts[0].remove();
   const r=wrap.getBoundingClientRect();const s=document.createElement('span');s.className='pt';s.style.left=(x-r.left-4)+'px';s.style.top=(y-r.top-4)+'px';wrap.appendChild(s);setTimeout(function(){s.remove();},950);
 }
 dock.addEventListener('mousemove',function(e){renderDock(e.clientX);trailPt(e.clientX,e.clientY);});
 dock.addEventListener('mouseleave',resetDock);
 dock.addEventListener('touchmove',function(e){if(e.touches.length){renderDock(e.touches[0].clientX);}}, {passive:true});
 dock.addEventListener('touchend',resetDock);
 apps.forEach(function(a){a.addEventListener('mouseenter',function(){tip.textContent=a.getAttribute('data-label');tip.classList.add('show');});a.addEventListener('click',function(){clearSearch();});});
 function adapt(){if(apps.length>1){const r0=apps[0].getBoundingClientRect(),r1=apps[1].getBoundingClientRect();SIGMA=Math.max(46,(r1.left-r0.left)*0.85);}}
 window.addEventListener('resize',adapt);adapt();
}
function showNewSiteToasts(){
 const toast=document.getElementById('toastNotify');if(!toast)return;
 let seen=[];try{seen=JSON.parse(localStorage.getItem('landezhaole-seen-new')||'[]');}catch(e){seen=[];}
 const news=[];
 DATA.cats.forEach(cat=>cat.cards.forEach(c=>{if(/NEW/i.test(c.b||'')&&!seen.includes(c.u))news.push(c);}));
 if(!news.length)return;
 let stopped=false;
 document.getElementById('toastClose').onclick=function(e){e.stopPropagation();stopped=true;toast.style.visibility='hidden';};
 function tw(dur,update,done){
   const n=Math.max(1,Math.round(dur/16));let i=0;
   (function tick(){i++;const p=Math.min(1,i/n);update(p);if(p<1){setTimeout(tick,16);}else if(done){done();}})();
 }
 function easeOutQuad(x){return 1-(1-x)*(1-x);}
 toast.onclick=function(){if(news[0])window.open(news[0].u,'_blank');};
 function show(cb){
   toast.style.visibility='visible';toast.style.opacity='1';
   document.getElementById('toastIc').textContent='新';
   document.getElementById('toastTt').textContent='站点上新';
   document.getElementById('toastBd').textContent='「'+news.map(n=>n.t).join('、')+'」已加入站点导航，去看看';
   tw(560,function(p){const e=easeOutQuad(p);toast.style.transform='translateX('+(400*(1-e)).toFixed(1)+'px) skewX('+(-12*(1-e)).toFixed(2)+'deg)';},cb);
 }
 function hide(cb){
   tw(400,function(p){const e=p*p;toast.style.transform='translateX('+(-e*420).toFixed(1)+'px) skewX('+(e*10).toFixed(2)+'deg)';toast.style.opacity=(1-p).toFixed(2);},function(){toast.style.visibility='hidden';cb();});
 }
 show(function(){
   setTimeout(function(){
     if(stopped)return;
     news.forEach(n=>seen.push(n.u));try{localStorage.setItem('landezhaole-seen-new',JSON.stringify(seen));}catch(e){}
     hide(function(){});
   },3500);
 });
}
window.siteVersionData=null;
function showUpdateModal(data,markSeen){
 window.siteVersionData=data;
 document.getElementById('updateVer').textContent='版本 '+data.version+' · '+data.date;
 document.getElementById('updateList').innerHTML=(data.changelog||[]).map(c=>`<li>${esc(c)}</li>`).join('');
 const overlay=document.getElementById('updateOverlay');
 overlay.classList.add('show');
 const close=function(){overlay.classList.remove('show');if(markSeen){try{localStorage.setItem('landezhaole-seen-site-version',data.version);}catch(e){}}};
 document.getElementById('updateCloseBtn').onclick=close;
 overlay.onclick=function(e){if(e.target===overlay)close();};
}
function checkSiteUpdate(){
 fetch('version.json').then(r=>r.json()).then(data=>{
   let seen=null;try{seen=localStorage.getItem('landezhaole-seen-site-version');}catch(e){}
   window.siteVersionData=data;
   if(seen!==data.version)setTimeout(function(){showUpdateModal(data,true);},5000);
 }).catch(function(){});
}
let appDlSeq=0;
function fmtSize(b){if(!b)return '';return (b/1048576).toFixed(1)+' MB';}
function appDlCard(a){
 const icon=a.icon||'';
 const av=`<div class="avatar" style="background:${avColor(a.label||'A')}">${icon?`<img src="${esc(icon)}" loading="lazy" alt="">`:''}</div>`;
 const desc=[a.package,a.ver_name?('v'+a.ver_name):'',fmtSize(a.size),a.downloads!=null?(a.downloads+' 次下载'):'' ].filter(Boolean).join(' · ');
 return `<div class="card-wrap appdl-wrap"><div class="card" style="cursor:pointer" title="点卡片直接下载" onclick="appDlCardDownload(this)">${av}<div class="info"><div class="name"><span class="ntext">${esc(a.label)}</span></div><div class="desc">${esc(desc)}</div></div></div><button type="button" class="apk-btn" onclick="startAppDownload(this,'${esc(a.app_id)}','${esc(a.label)}',${a.size||0})">⬇ 下载 APK</button></div>`;
}
let appDlQ='',appDlCache=[],appDlShown=0,appDlNextOffset=0,appDlTotal=0,appDlLoading=false;
async function fetchAppPage(q,offset){
 const worker='https://landezhaole-app-proxy.307779523.workers.dev/?q='+encodeURIComponent(q)+'&offset='+offset;
 const api='https://appteka.store/api/1/app/search?query='+encodeURIComponent(q)+'&locale=en&offset='+offset;
 for(const u of [worker,'https://api.allorigins.win/raw?url='+encodeURIComponent(api)]){
   try{const r=await fetch(u);if(!r.ok)continue;const j=await r.json();
     if(j&&Array.isArray(j.entries))return {total:j.total||j.entries.length,entries:j.entries};
     if(j&&j.status===200&&j.result&&Array.isArray(j.result.entries))return {total:j.result.total||j.result.entries.length,entries:j.result.entries};
   }catch(e){}
 }
 return null;
}
function appDlRefreshMore(){
 const more=document.getElementById('appDlMore');
 const left=appDlTotal-appDlShown;
 more.style.display=left>0?'':'none';
 more.textContent=appDlLoading?'正在找…':'找更多（已显示 '+appDlShown+' / '+appDlTotal+'）';
}
function appDlShowBatch(){
 const grid=document.getElementById('appDlGrid');
 const batch=appDlCache.slice(appDlShown,appDlShown+12);
 grid.insertAdjacentHTML('beforeend',batch.map(appDlCard).join(''));
 appDlShown+=batch.length;
 document.getElementById('appDlCount').textContent='共 '+appDlTotal+' 个应用，已显示 '+appDlShown+' 个';
 appDlRefreshMore();
}
async function appDlLoadMore(){
 if(appDlLoading)return;appDlLoading=true;appDlRefreshMore();
 try{
   if(appDlShown<appDlCache.length){appDlShowBatch();}
   else if(appDlNextOffset<appDlTotal){
     const page=await fetchAppPage(appDlQ,appDlNextOffset);
     if(page){appDlCache=appDlCache.concat(page.entries);appDlNextOffset+=96;appDlShowBatch();}
     else document.getElementById('appDlStatus').textContent='找更多失败，稍后再试。';
   }
 }finally{appDlLoading=false;appDlRefreshMore();}
}
async function renderAppDl(q){
 const seq=++appDlSeq,sec=document.getElementById('appDlSec'),grid=document.getElementById('appDlGrid'),st=document.getElementById('appDlStatus');
 sec.style.display='';grid.innerHTML='';st.textContent='正在搜应用 “'+q+'”…';document.getElementById('appDlNote').textContent='';
 appDlQ=q;appDlCache=[];appDlShown=0;appDlNextOffset=0;appDlTotal=0;
 const page=await fetchAppPage(q,0);
 if(seq!==appDlSeq)return;
 if(!page){st.textContent='应用搜索暂时不可用，换个关键词或稍后再试。';appDlRefreshMore();return;}
 appDlCache=page.entries;appDlTotal=page.total;appDlNextOffset=96;
 st.textContent='点“下载 APK”在本页直接下载，不跳走；跑满后文件进系统下载目录，点开即可安装。';
 appDlShowBatch();
}
function appDlCardDownload(card){
 const wrap=card.closest('.card-wrap');if(!wrap)return;
 const btn=wrap.querySelector('.apk-btn');if(!btn||btn.dataset.busy==='1')return;
 const m=btn.getAttribute('onclick')||'';
 // 从按钮的 onclick 里取参数，避免再拼一遍
 const mm=m.match(/startAppDownload\(this,'([^']*)','([^']*)',(\d+)\)/);
 if(mm)startAppDownload(btn,mm[1],mm[2],parseInt(mm[3],10)||0);
}
function fmtMB(b){return (b/1048576).toFixed(1)+' MB';}
async function startAppDownload(btn,appId,label,size){
 const wrap=btn.closest('.card-wrap');if(!wrap)return;
 if(btn.dataset.busy==='1'){if(btn._dlCtrl)btn._dlCtrl.abort();btn.dataset.cancel='1';return;}
 btn.dataset.busy='1';btn.dataset.cancel='';btn.textContent='下载中…';const dlCtrl=new AbortController();btn._dlCtrl=dlCtrl;
 let prog=wrap.querySelector('.apk-prog');
 if(!prog){prog=document.createElement('div');prog.className='apk-prog';prog.innerHTML='<div class="apk-bar"><i></i></div><div class="apk-text">准备下载…</div><button type="button" class="apk-cancel">取消</button>';btn.after(prog);}
 const bar=prog.querySelector('.apk-bar i'),txt=prog.querySelector('.apk-text'),cancel=prog.querySelector('.apk-cancel');
 cancel.onclick=()=>{txt.textContent='正在取消…';dlCtrl.abort();btn.dataset.cancel='1';};
 const total=size||0;
 if(!total){txt.textContent='拿不到文件大小，下载失败。';btn.dataset.busy='';btn.textContent='⬇ 下载 APK';return;}
 // zip 下载器思路的网页版：8MB 以下单段，8MB 以上按 4MB 分段、4 路并行、段失败重试（200ms 起翻倍）
 const SEG=4*1024*1024, segCount=total<8*1024*1024?1:Math.ceil(total/SEG);
 const parts=new Array(segCount);let nextSeg=0,received=0;const t0=Date.now();
 const upd=()=>{const pct=Math.floor(received/total*100);bar.style.width=pct+'%';txt.textContent=pct+'% · '+fmtMB(received)+' / '+fmtMB(total)+' · '+(received/Math.max(1,(Date.now()-t0)/1000)/1048576).toFixed(1)+' MB/s';btn.textContent='下载中 '+pct+'%';};
 async function fetchSeg(idx){
   const start=idx*SEG,end=Math.min(total, start+SEG)-1;
   for(let attempt=0;attempt<3;attempt++){
     if(btn.dataset.cancel==='1')return false;
     try{
       const r=await fetch('https://landezhaole-app-proxy.307779523.workers.dev/segment?app_id='+encodeURIComponent(appId)+'&start='+start+'&end='+end,{signal:dlCtrl.signal});
       if(!r.ok)throw new Error('seg '+r.status);
       const buf=await r.arrayBuffer();parts[idx]=buf;received+=buf.byteLength;upd();return true;
     }catch(e){if(dlCtrl.signal.aborted||btn.dataset.cancel==='1')return false;await new Promise(res=>setTimeout(res,200*(1<<attempt)));}
   }
   return false;
 }
 let ok=true;
 const lanes=Array.from({length:Math.min(8,segCount)},async()=>{
   while(nextSeg<segCount){
     if(btn.dataset.cancel==='1')break;
     const idx=nextSeg++;
     if(!(await fetchSeg(idx))){ok=false;break;}
   }
 });
 await Promise.all(lanes);
 if(btn.dataset.cancel==='1'||dlCtrl.signal.aborted){txt.textContent='已取消。';btn.dataset.busy='';btn._dlCtrl=null;btn.textContent='⬇ 下载 APK';return;}
 if(!ok||parts.some(p=>!p)){txt.textContent='下载失败，点“下载 APK”重试。';btn.dataset.busy='';btn._dlCtrl=null;btn.textContent='⬇ 下载 APK';return;}
 const blob=new Blob(parts,{type:'application/vnd.android.package-archive'});
 const url=URL.createObjectURL(blob);const a=document.createElement('a');
 a.href=url;a.download='懒得找了.apk';document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),60000);
 bar.style.width='100%';txt.textContent='已下载到系统下载目录，点开“懒得找了.apk”即可安装（需允许安装未知应用）。';
 btn.dataset.busy='';btn._dlCtrl=null;btn.textContent='已下载，去安装';
}
function doSearch(siteOnly){
 const q=document.getElementById('q').value.trim();
 const res=document.getElementById('results');
 const cats=document.getElementById('cats');
 if(curEngine!=='site'&&curEngine!=='appdl'){ if(q) window.open(ENGINES.find(e=>e.id===curEngine).url+encodeURIComponent(q),'_blank'); return; }
 if(!q){res.classList.remove('show');document.getElementById('appDlSec').style.display='none';if(cats)cats.style.display='';return;}
 if(curEngine==='appdl'){
   document.getElementById('resGrid').innerHTML='';document.getElementById('resEmpty').style.display='none';document.getElementById('resCount').textContent='';
   document.querySelector('#results section.cat').style.display='none';
   if(cats)cats.style.display='none';res.classList.add('show');
   if(!siteOnly)renderAppDl(q);
   return;
 }
 document.querySelector('#results section.cat').style.display='';
 const low=q.toLowerCase();let list=[];
 DATA.cats.forEach(cat=>cat.cards.forEach(c=>{
   const hay=(c.t+' '+c.d+' '+(c.b||'')+' '+c.u+' '+cat.name).toLowerCase();
   if(hay.includes(low))list.push(c);
 }));
 const rank=c=>/NEW/i.test(c.b||'')||/新/i.test(c.b||'')?2:/HOT/i.test(c.b||'')?1:0;
 list.sort((a,b)=>rank(b)-rank(a));
 document.getElementById('resCount').textContent='搜索结果（'+list.length+'）';

}

// 翻页时钟：数字变化时才翻牌，减动效偏好下直接静态切换
const FLIP_IDS=['h1','h2','m1','m2','s1','s2'];
let flipLast='';
const flipReduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function flipPad(n){return n.toString().padStart(2,'0');}
function flipSetStatic(el,digit){const c=el.querySelector('.current');c.dataset.num=digit;c.dataset.numNext=digit;el.style.setProperty('--digit',"'"+digit+"'");}
function flipDigit(el,from,to){
 const c=el.querySelector('.current');c.dataset.num=to;
 const f=document.createElement('div');f.className='num flip';f.setAttribute('data-num',from);f.setAttribute('data-num-next',to);el.appendChild(f);
 f.addEventListener('animationend',function(){el.style.setProperty('--digit',"'"+to+"'");f.remove();});
}
function updateFlipClock(){
 const now=new Date();const str=flipPad(now.getHours())+flipPad(now.getMinutes())+flipPad(now.getSeconds());
 if(str===flipLast)return;
 for(let i=0;i<6;i++){
  const el=document.getElementById(FLIP_IDS[i]);if(!el)continue;
  const nd=str[i];const od=flipLast?flipLast[i]:el.querySelector('.current').dataset.num;
  if(!flipLast)flipSetStatic(el,nd);
  else if(od!==nd){if(flipReduced)flipSetStatic(el,nd);else flipDigit(el,od,nd);}
 }
 flipLast=str;
}
setInterval(updateFlipClock,200);updateFlipClock();
